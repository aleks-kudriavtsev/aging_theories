name: Joint23 uncertainty and source-contract checks
on:
  push:
    branches: [research/nfl-robustness-joint-23]
    paths: [research/mortality/joint23/**, tests/test_joint23.py, .github/workflows/joint23-checks.yml]
  pull_request:
    paths: [research/mortality/joint23/**, tests/test_joint23.py, .github/workflows/joint23-checks.yml]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy pandas scipy scikit-learn
      - name: Run only synthetic contract and numerical tests, no participant downloads
        run: |
          python - <<'PY'
          import sys,unittest
          sys.path.insert(0,'tests')
          from test_joint23 import ContractTests,RefitTests
          suite=unittest.TestSuite()
          for case in (ContractTests,RefitTests):
              suite.addTests(unittest.defaultTestLoader.loadTestsFromTestCase(case))
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun==27 and not result.skipped
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
