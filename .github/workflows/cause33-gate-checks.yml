name: Cause33 separate-outcome source and count gate
on:
  push:
    branches: [research/cause-gate-33]
    paths: ['research/mortality/cause33/**', 'tests/test_cause33*.py', '.github/workflows/cause33-gate-checks.yml']
  pull_request:
    paths: ['research/mortality/cause33/**', 'tests/test_cause33*.py', '.github/workflows/cause33-gate-checks.yml']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -p 'test_cause33*.py' -v
  empirical:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Preserved official sources without retrying denied documentation
        run: python -m research.mortality.cause33.retrieve --out /tmp/cause33_cdc
      - name: Aggregate source and event qualification without model fits
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m research.mortality.cause33.qualify --source /tmp/cause33_cdc --out /tmp/cause33_results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cause33-gate-aggregates
          path: /tmp/cause33_results/
          retention-days: 14
          if-no-files-found: error
