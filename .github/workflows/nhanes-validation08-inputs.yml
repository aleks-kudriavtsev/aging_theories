name: Retrieve locked validation08 inputs
on:
  push:
    branches: [research/scientific-validation-08]
    paths: [.github/workflows/nhanes-validation08-inputs.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retrieve bounded official public CDC inputs only
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, urllib.request, urllib.parse
          root=pathlib.Path('validation08_inputs');root.mkdir()
          hosts={'wwwn.cdc.gov','ftp.cdc.gov','www.cdc.gov'}
          base='https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/'
          urls={}
          for year,suffix in [(2005,'D'),(2007,'E')]:
              for component in ['DEMO','BPX','BMX','SMQ','MCQ','BPQ','DIQ','BIOPRO','TCHOL','HDL','GHB','ALB_CR','CBC','CRP']:
                  for ext in ['xpt','htm']:
                      name=f'{component}_{suffix}.{ext}'
                      urls[f'{year}_{name}']=f'{base}{year}/DataFiles/{name}'
              urls[f'{year}_mortality.dat']=f'https://ftp.cdc.gov/pub/Health_Statistics/NCHS/datalinkage/linked_mortality/NHANES_{year}_{year+1}_MORT_2019_PUBLIC.dat'
          urls['lmf_directory.html']='https://ftp.cdc.gov/pub/Health_Statistics/NCHS/datalinkage/linked_mortality/'
          urls['lmf_documentation.html']='https://www.cdc.gov/nchs/linked-data/mortality-files/index.html'
          def retrieve(item):
              name,url=item
              try:
                  assert urllib.parse.urlparse(url).hostname in hosts
                  req=urllib.request.Request(url,headers={'User-Agent':'ResearchValidation08/1.0'})
                  with urllib.request.urlopen(req,timeout=45) as response:
                      final=response.url
                      assert urllib.parse.urlparse(final).hostname in hosts
                      data=response.read(30_000_001)
                  if len(data)>30_000_000:raise ValueError('source exceeds 30MB bound')
                  if name.endswith('.xpt') and not data.startswith(b'HEADER RECORD'):raise ValueError('not XPORT')
                  if name.endswith('.dat') and b'<html' in data[:1000].lower():raise ValueError('not mortality data')
                  (root/name).write_bytes(data)
                  return {'file':name,'url':url,'resolved_url':final,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'status':'retrieved'}
              except Exception as e:
                  return {'file':name,'url':url,'status':'failed','error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:rows=list(ex.map(retrieve,urls.items()))
          (root/'manifest.json').write_text(json.dumps({'analysis_lock_commit':'f61b86c6fc00a43ae2490cf001b06c680271af63','files':rows},indent=2))
          print(json.dumps({'retrieved':sum(r['status']=='retrieved' for r in rows),'failed':[r for r in rows if r['status']=='failed']},indent=2))
          PY
      - name: Preserve input artifact without publishing participant rows in git
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nhanes-validation08-inputs
          path: validation08_inputs/
          retention-days: 1
          if-no-files-found: error
