name: Freeze30 research artifact and transfer gates
on:
  push:
    branches: [research/frozen-transfer-30]
    paths: ['research/mortality/freeze30/**', 'tests/test_freeze30*.py', '.github/workflows/freeze30-checks.yml']
  pull_request:
    paths: ['research/mortality/freeze30/**', 'tests/test_freeze30*.py', '.github/workflows/freeze30-checks.yml']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -p 'test_freeze30*.py' -v
  final-training:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Same authorized public training sources in temporary runner storage
        run: python -m research.mortality.routine29.retrieve --out /tmp/freeze30_cdc
      - name: Construct final artifacts; these are not new validation results
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m research.mortality.freeze30.freeze --source /tmp/freeze30_cdc --out /tmp/freeze30_first
          python -m research.mortality.freeze30.freeze --source /tmp/freeze30_cdc --out /tmp/freeze30_replay
          cmp /tmp/freeze30_first/FROZEN_MODELS.json /tmp/freeze30_replay/FROZEN_MODELS.json
          cmp /tmp/freeze30_first/FREEZE_MANIFEST.json /tmp/freeze30_replay/FREEZE_MANIFEST.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freeze30-aggregate-artifacts
          path: /tmp/freeze30_first/
          retention-days: 14
          if-no-files-found: error
