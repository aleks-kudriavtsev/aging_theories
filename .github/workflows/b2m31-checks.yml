name: B2M31 matched routine-core checks
on:
  push:
    branches: [research/b2m-routine-31]
    paths: ['research/mortality/b2m31/**', 'tests/test_b2m31*.py', '.github/workflows/b2m31-checks.yml']
  pull_request:
    paths: ['research/mortality/b2m31/**', 'tests/test_b2m31*.py', '.github/workflows/b2m31-checks.yml']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -p 'test_b2m31*.py' -v
  empirical:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Resolve official source anchor and retrieve protocol-bound public inputs
        run: python -m research.mortality.b2m31.retrieve --out /tmp/b2m31_cdc
      - name: Prespecified comparisons and 500 paired full nested refits
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m research.mortality.b2m31.analyze --source /tmp/b2m31_cdc --out /tmp/b2m31_results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b2m31-aggregates
          path: /tmp/b2m31_results/
          retention-days: 14
          if-no-files-found: error
