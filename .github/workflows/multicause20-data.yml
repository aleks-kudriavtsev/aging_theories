name: Multicause20 official public inputs
on:
  push:
    branches: [research/multicause-20]
    paths: [.github/workflows/multicause20-data.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Bounded retrieval of documented CDC public files only
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,json,hashlib,concurrent.futures
          root=pathlib.Path('nhefs20_inputs');root.mkdir()
          base='https://wwwn.cdc.gov/nchs/data/'
          urls={f'DU{x}.txt':base+f'nhanes1/DU{x}.txt' for x in ['4800','4111','4233','4091']}
          urls.update({'n92vitl.txt':base+'nhefs/n92vitl.txt','N92mort.txt':base+'nhefs/N92mort.txt'})
          for name in ['DU4091.sas','DU4091_F.sas','4091.pdf']:urls[name]=base+'nhanes1/'+name
          def get(item):
              name,url=item
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MulticauseResearch20/1.0'}),timeout=60) as r:
                  if urllib.parse.urlparse(r.url).hostname not in {'wwwn.cdc.gov','www.cdc.gov','ftp.cdc.gov'}:raise ValueError('Unexpected redirect')
                  data=r.read(25000001)
              if len(data)>25000000 or b'<html' in data[:1000].lower():raise ValueError('Size/type mismatch')
              if name.endswith('.pdf') and not data.startswith(b'%PDF'):raise ValueError('Invalid PDF')
              (root/name).write_bytes(data)
              return {'file':name,'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:rows=list(ex.map(get,urls.items()))
          manifest={'analysis_plan_commit':'858c7e5a7a13799a093d64eb1295b16af2a65a86','source':'original_CDC_public_NHEFS1992_NHANESI','files':rows}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps({'files':rows,'individual_records_printed':False},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multicause20-public-inputs
          path: nhefs20_inputs/
          retention-days: 1
          if-no-files-found: error
