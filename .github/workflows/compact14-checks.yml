name: Compact14 research runtime checks
on:
  push:
    branches: [research/compact-panel-14]
    paths: [research/mortality/replay_compact14.py, research/mortality/compact14/**, tests/test_compact14_runtime.py, .github/workflows/compact14-checks.yml]
  pull_request:
    paths: [research/mortality/replay_compact14.py, research/mortality/compact14/**, tests/test_compact14_runtime.py, .github/workflows/compact14-checks.yml]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Standard-library runtime and integrity checks
        shell: bash
        run: |
          set -euo pipefail
          python -S -m unittest discover -s tests -p 'test_compact14_runtime.py' -v
          python -S -m research.mortality.replay_compact14 --demo --out "$RUNNER_TEMP/compact14.json"
