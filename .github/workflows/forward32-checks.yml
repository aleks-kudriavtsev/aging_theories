name: Forward32 fixed-calendar B2M stress checks
on:
  push:
    branches: [research/forward-calendar-32]
    paths: ['research/mortality/forward32/**', 'tests/test_forward32*.py', '.github/workflows/forward32-checks.yml']
  pull_request:
    paths: ['research/mortality/forward32/**', 'tests/test_forward32*.py', '.github/workflows/forward32-checks.yml']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -p 'test_forward32*.py' -v
  empirical:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Preserved public sources bound to forward protocol
        run: python -m research.mortality.forward32.retrieve --out /tmp/forward32_cdc
      - name: Early-only fits and separate fixed-training versus joint-refit uncertainty
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m research.mortality.forward32.analyze --source /tmp/forward32_cdc --out /tmp/forward32_results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forward32-aggregates
          path: /tmp/forward32_results/
          retention-days: 14
          if-no-files-found: error
