name: Endpoint11 official source audit
on:
  push:
    branches: [research/endpoint-readiness-11]
    paths: [.github/workflows/endpoint11-source-audit.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read public data and access documentation, never restricted records
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, urllib.request, urllib.parse
          from html.parser import HTMLParser
          root=pathlib.Path('endpoint11_sources');root.mkdir()
          hosts={'www.cdc.gov','wwwn.cdc.gov','ftp.cdc.gov'}
          class Links(HTMLParser):
              def __init__(self):super().__init__();self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      value=dict(attrs).get('href','')
                      if value:self.links.append(value)
          def get(name,url):
              try:
                  p=urllib.parse.urlparse(url)
                  if p.scheme!='https' or p.hostname not in hosts:raise ValueError('unapproved source')
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'EndpointFeasibilityResearch/1.0'}),timeout=30) as response:
                      if urllib.parse.urlparse(response.url).hostname not in hosts:raise ValueError('unapproved redirect')
                      data=response.read(20000001)
                  if len(data)>20000000:raise ValueError('source exceeds bound')
                  if name.endswith('.xpt') and not data.startswith(b'HEADER RECORD'):raise ValueError('not XPORT')
                  if name.endswith('.pdf') and not data.startswith(b'%PDF'):raise ValueError('not PDF')
                  (root/name).write_bytes(data)
                  return {'file':name,'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'status':'retrieved'}
              except Exception as e:return {'file':name,'url':url,'status':'failed','error':str(e)}
          page='https://www.cdc.gov/nchs/linked-data/mortality-files/index.html'
          rows=[get('cdc_lmf_page.html',page)]
          if rows[0]['status']=='retrieved':
              parser=Links();parser.feed((root/'cdc_lmf_page.html').read_text())
              docs=sorted({urllib.parse.urljoin(page,u) for u in parser.links if '.pdf' in u and any(s in u.lower() for s in ['dictionary','layout','description','mortality'])})
              for i,url in enumerate(docs[:12]):rows.append(get(f'dictionary_{i:02}.pdf',url))
          urls={}
          for comp in ['DEMO','BPX','BMX','SMQ','MCQ','BPQ','DIQ','BIOPRO','TCHOL','HDL','GHB','ALB_CR','CBC','CRP']:
              name=f'{comp}_F.xpt';urls[f'2009_{name}']=f'https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2009/DataFiles/{name}'
          urls['2009_mortality.dat']='https://ftp.cdc.gov/pub/Health_Statistics/NCHS/datalinkage/linked_mortality/NHANES_2009_2010_MORT_2019_PUBLIC.dat'
          urls['archived_index.html']='https://ftp.cdc.gov/pub/Health_Statistics/NCHS/datalinkage/linked_mortality/archived_files/'
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:rows+=list(ex.map(lambda item:get(*item),urls.items()))
          (root/'manifest.json').write_text(json.dumps({'purpose':'Retrospective endpoint feasibility, no new validation or clinical data access','previously_studied_cycles':[1999,2001,2003,2005,2007,2009],'files':rows},indent=2))
          print(json.dumps(rows,indent=2))
          if any(r['status']!='retrieved' for r in rows if r['file'].endswith(('.xpt','.dat'))):raise SystemExit('Required data missing')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: endpoint11-official-inputs
          path: endpoint11_sources/
          retention-days: 1
          if-no-files-found: error
