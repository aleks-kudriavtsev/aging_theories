name: Pinned PR115 audit inputs
on:
  push:
    branches: [research/pr115-methodology-integration]
    paths: [.github/workflows/pr115-audit-inputs.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect public pinned source snapshots without executing repository code
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request, urllib.parse
          root = pathlib.Path('audit_inputs'); root.mkdir()
          allowed = {'codeload.github.com', 'api.github.com'}
          sources = {
              'aging_biomarkers_pr115.zip': 'https://codeload.github.com/aleks-kudriavtsev/aging_biomarkers/zip/3c487a8d03b15a49ce1d067e8eba903dab826b10',
              'aging_theories_baseline.zip': 'https://codeload.github.com/aleks-kudriavtsev/aging_theories/zip/fe414dc1957d8c6041dce48e77cf58ee65b30d28',
              'pr115_files.json': 'https://api.github.com/repos/aleks-kudriavtsev/aging_biomarkers/pulls/115/files?per_page=100',
              'pr115_metadata.json': 'https://api.github.com/repos/aleks-kudriavtsev/aging_biomarkers/pulls/115',
              'pr115_runs.json': 'https://api.github.com/repos/aleks-kudriavtsev/aging_biomarkers/actions/runs?head_sha=3c487a8d03b15a49ce1d067e8eba903dab826b10&per_page=100'
          }
          manifest = []
          for name, url in sources.items():
              parsed = urllib.parse.urlparse(url)
              assert parsed.scheme == 'https' and parsed.hostname in allowed
              request = urllib.request.Request(url, headers={'User-Agent': 'Pinned-methodology-audit/1.0'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  final = urllib.parse.urlparse(response.url)
                  assert final.scheme == 'https' and final.hostname in allowed
                  payload = response.read(120_000_001)
                  if len(payload) > 120_000_000:
                      raise ValueError('Input exceeds bounded retrieval size')
              (root / name).write_bytes(payload)
              row = {'name': name, 'url': url, 'bytes': len(payload), 'sha256': hashlib.sha256(payload).hexdigest()}
              manifest.append(row)
              print(json.dumps(row), flush=True)
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY
      - name: Store audit inputs briefly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr115-pinned-audit-inputs
          path: audit_inputs/
          retention-days: 1
          if-no-files-found: error
