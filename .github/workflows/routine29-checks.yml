name: Routine29 renal-core protein checks
on:
  push:
    branches: [research/renal-routine-29]
    paths: ['research/mortality/routine29/**', 'tests/test_routine29*.py', '.github/workflows/routine29-checks.yml']
  pull_request:
    paths: ['research/mortality/routine29/**', 'tests/test_routine29*.py', '.github/workflows/routine29-checks.yml']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -p 'test_routine29*.py' -v
  empirical:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Public inputs in temporary runner directory
        run: python -m research.mortality.routine29.retrieve --out /tmp/routine29_cdc
      - name: Prespecified routine renal comparison and paired nested refitting
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m research.mortality.routine29.analyze --source /tmp/routine29_cdc --out /tmp/routine29_results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: routine29-aggregates
          path: /tmp/routine29_results/
          retention-days: 14
          if-no-files-found: error
