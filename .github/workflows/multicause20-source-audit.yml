name: Multicause20 source documentation
on:
  push:
    branches: [research/multicause-20]
    paths: [.github/workflows/multicause20-source-audit.yml]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Original CDC documentation only
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,json,re,hashlib,html
          root=pathlib.Path('multicause20_docs');root.mkdir()
          hosts={'wwwn.cdc.gov','www.cdc.gov','ftp.cdc.gov'}
          manifest=[];links=[]
          def get(url,name):
              try:
                  assert urllib.parse.urlparse(url).hostname in hosts
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ResearchSourceAudit/1.0'}),timeout=40) as r:
                      assert urllib.parse.urlparse(r.url).hostname in hosts
                      data=r.read(20000001)
                  if len(data)>20000000:raise ValueError('size bound')
                  (root/name).write_bytes(data)
                  manifest.append({'name':name,'url':url,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'status':'retrieved'})
                  return data
              except Exception as e:
                  manifest.append({'name':name,'url':url,'status':'failed','error':str(e)});return b''
          pages={'nhefs':'https://wwwn.cdc.gov/nchs/nhanes/nhefs/','nhanes1':'https://wwwn.cdc.gov/nchs/nhanes/nhanes1/default.aspx'}
          for kind,url in pages.items():
              text=get(url,kind+'.html').decode('utf-8','replace')
              for row in re.findall(r'<tr\b[^>]*>(.*?)</tr>',text,re.S|re.I):
                  label=html.unescape(re.sub('<[^>]+>',' ',row));label=' '.join(label.split())
                  wanted=(kind=='nhefs' and any(x in label for x in ['1992 Nhefs Vital','1992 Nhefs Mortality','1982-1984 Nhefs Interview'])) or (kind=='nhanes1' and any(x in label for x in ['4800','4111','4233','4081','4250']))
                  if not wanted:continue
                  hrefs=re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',row,re.S|re.I)
                  for index,(href,caption) in enumerate(hrefs):
                      target=urllib.parse.urljoin(url,html.unescape(href));item={'row':label,'index':index,'url':target,'caption':re.sub('<[^>]+>','',caption)};links.append(item)
                      # First link is participant data; do not retrieve in this stage.
                      if index>0:
                          name=kind+'_'+str(len(links))+'_'+urllib.parse.urlparse(target).path.rsplit('/',1)[-1]
                          get(target,name)
          for name in ['nhanes3_sample_ascii_pgm_2010.sas','nhanes3_readme_mortality_2010.txt']:
              get('https://ftp.cdc.gov/pub/Health_Statistics/NCHS/datalinkage/linked_mortality/archived_files/'+name,name)
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          (root/'source_links.json').write_text(json.dumps(links,indent=2))
          print(json.dumps({'documents':manifest,'links':links},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multicause20-codebooks
          path: multicause20_docs/
          retention-days: 3
          if-no-files-found: error
