name: Endpoint11 dictionary inputs
on:
  push:
    branches: [research/endpoint-readiness-11]
    paths: [.github/workflows/endpoint11-dictionaries.yml]
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch three public official reference PDFs, no restricted records
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,urllib.request
          root=pathlib.Path('endpoint11_dictionaries');root.mkdir()
          rows=[]
          for name in ['public-use-linked-mortality-files-data-dictionary.pdf','public-use-linked-mortality-file-description.pdf','underlying-and-multiple-cause-of-death-codes-508.pdf']:
              url='https://www.cdc.gov/nchs/data/datalinkage/'+name
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'EndpointFeasibilityResearch/1.0'}),timeout=40) as r:data=r.read(4000001)
              if not data.startswith(b'%PDF') or len(data)>4000000:raise ValueError('Unexpected reference input')
              (root/name).write_bytes(data)
              rows.append({'file':name,'url':url,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
          (root/'manifest.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: endpoint11-dictionaries
          path: endpoint11_dictionaries/
          retention-days: 1
          if-no-files-found: error
