name: Replication34 readiness and conditional precision checks
on:
  push:
    branches: [research/replication-readiness-34]
    paths: ['research/mortality/replication34/**', 'tests/test_replication34*.py', '.github/workflows/replication34-checks.yml']
  pull_request:
    paths: ['research/mortality/replication34/**', 'tests/test_replication34*.py', '.github/workflows/replication34-checks.yml']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -p 'test_replication34*.py' -v
  scenarios:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Frozen metadata qualification and stipulated precision simulation only
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m research.mortality.replication34.analyze --out /tmp/replication34_results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replication34-aggregate-planning
          path: /tmp/replication34_results/
          retention-days: 14
          if-no-files-found: error
