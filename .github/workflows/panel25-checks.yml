name: Panel25 exploratory pipeline checks
on:
  push:
    branches: [research/panel-expansion-25-current]
    paths: ['research/mortality/panel25/**', 'tests/test_panel25.py', '.github/workflows/panel25-checks.yml']
  pull_request:
    paths: ['research/mortality/panel25/**', 'tests/test_panel25.py', '.github/workflows/panel25-checks.yml']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Mathematics, identities and frozen baseline; no individual data in CI
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m unittest discover -s tests -p test_panel25.py -v
  empirical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Public CDC inputs in temporary runner only
        run: python -m research.mortality.panel25.retrieve --out /tmp/panel25_cdc
      - name: Reproduce baseline and evaluate locked exploratory extension
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m research.mortality.panel25.analyze --source /tmp/panel25_cdc --out /tmp/panel25_results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panel25-aggregates
          path: /tmp/panel25_results/
          retention-days: 14
          if-no-files-found: error
