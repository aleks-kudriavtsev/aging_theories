name: Unified mortality studio16
on:
  push:
    branches: [dev/unified-studio-16]
  pull_request:
    paths: ['research/mortality/studio16/**', 'research/mortality/workbench/__main__.py', 'pyproject.toml', 'tests/test_studio16.py', 'tools/check_studio16*', '.github/workflows/studio16-checks.yml']
permissions:
  contents: read
jobs:
  runtime:
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '${{ matrix.python }}'}
      - name: Unit and actual HTTP integration
        run: python -S -m unittest discover -s tests -p test_studio16.py -v
      - run: python -m pip install setuptools==82.0.1 wheel==0.46.3
      - run: python -c "from setuptools import build_meta; build_meta.build_wheel('dist')"
      - run: python tools/check_studio16_install.py --wheel dist/mortality_workbench-0.16.0-py3-none-any.whl
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Real browser to local HTTP API, without mocked responses
        run: python tools/check_studio16_browser.py --out browser-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: studio16-browser-checks
          path: browser-results/
          retention-days: 7
          if-no-files-found: warn
