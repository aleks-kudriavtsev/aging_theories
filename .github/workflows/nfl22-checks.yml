name: NfL22 and joint protein audit checks
on:
  push:
    branches: [research/nfl-joint-proteins-22]
    paths: ['research/mortality/nfl22/**', 'tests/test_nfl22.py', '.github/workflows/nfl22-checks.yml']
  pull_request:
    paths: ['research/mortality/nfl22/**', 'tests/test_nfl22.py', '.github/workflows/nfl22-checks.yml']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Mathematics, identities and frozen baseline; no individual data in CI
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m unittest discover -s tests -p test_nfl22.py -v
