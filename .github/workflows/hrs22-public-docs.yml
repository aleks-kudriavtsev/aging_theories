name: HRS22 public documentation
on:
  push:
    branches: [research/nfl-joint-proteins-22]
    paths: [.github/workflows/hrs22-public-docs.yml]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,json,html.parser,collections
          root=pathlib.Path('hrs22_docs');root.mkdir();rows=[]
          urls=['https://hrs.isr.umich.edu/sites/default/files/meta/vbs/neuropathological/codebook/hcapbiopilot_00.html','https://hrsdata.isr.umich.edu/node/38281','https://hrsdata.isr.umich.edu/node/40138','https://hrsdata.isr.umich.edu/data-products/vbs-2016-neuropathological-and-supplemental-biomarkers']
          queue=collections.deque((u,0) for u in urls);seen=set()
          class Parser(html.parser.HTMLParser):
              def __init__(self):super().__init__();self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='a' and 'href' in a:self.links.append(a['href'])
                  if tag in {'frame','iframe'} and 'src' in a:self.links.append(a['src'])
          while queue and len(seen)<18:
              url,depth=queue.popleft()
              if url in seen:continue
              seen.add(url);name='doc'+str(len(seen))+('.pdf' if '.pdf' in url.lower() else '.html')
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; PublicResearchMetadata/1.0)'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      if urllib.parse.urlsplit(r.url).hostname not in {'hrs.isr.umich.edu','hrsdata.isr.umich.edu','hrsonline.isr.umich.edu'}:raise ValueError('Host changed')
                      data=r.read(12000001)
                  if len(data)>12000000:raise ValueError('Too large')
                  (root/name).write_bytes(data);rows.append({'file':name,'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'status':'retrieved'})
                  if depth<2 and not data.startswith(b'%PDF'):
                      p=Parser();p.feed(data.decode('utf-8','replace'))
                      for href in p.links:
                          u=urllib.parse.urljoin(url,href).split('#')[0];parts=urllib.parse.urlsplit(u)
                          if parts.hostname in {'hrs.isr.umich.edu','hrsdata.isr.umich.edu','hrsonline.isr.umich.edu'} and '/sites/default/files/' in parts.path and ('.pdf' in parts.path.lower() or '/meta/vbs/' in parts.path):queue.append((u,depth+1))
              except Exception as e:rows.append({'url':url,'status':'failed','error':str(e)})
          (root/'manifest.json').write_text(json.dumps(rows,indent=2));print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hrs22-public-docs
          path: hrs22_docs/
          retention-days: 1
          if-no-files-found: error
