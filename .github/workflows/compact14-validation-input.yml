name: Compact14 frozen validation inputs
on:
  push:
    branches: [research/compact-panel-14]
    paths: [.github/workflows/compact14-validation-input.yml]
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve official public CDC inputs with frozen model provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,json,urllib.request,urllib.parse,hashlib,concurrent.futures
          root=pathlib.Path('validation14');root.mkdir()
          urls={f'2015_{c}_I.{ext}':f'https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2015/DataFiles/{c}_I.{ext}' for c in ['DEMO','BPX','BMX','SMQ','MCQ','BPQ','DIQ','BIOPRO','TCHOL','HDL','GHB','ALB_CR','CBC'] for ext in ['xpt','htm']}
          urls['2015_mortality.dat']='https://ftp.cdc.gov/pub/Health_Statistics/NCHS/datalinkage/linked_mortality/NHANES_2015_2016_MORT_2019_PUBLIC.dat'
          def get(item):
              name,url=item
              with urllib.request.urlopen(url,timeout=45) as r:
                  assert urllib.parse.urlparse(r.url).hostname in {'wwwn.cdc.gov','ftp.cdc.gov'}
                  data=r.read(20000001)
              if len(data)>20000000:raise ValueError('Oversize')
              if name.endswith('.xpt') and not data.startswith(b'HEADER RECORD'):raise ValueError('Not XPORT')
              if name.endswith('.dat') and b'<html' in data[:1000].lower():raise ValueError('Not mortality data')
              (root/name).write_bytes(data)
              return {'file':name,'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'status':'retrieved'}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: rows=list(pool.map(get,urls.items()))
          metadata={'analysis_lock_commit':'2389c6edeb806a3f6c8d3b19faff1ba0b446e0c5','frozen_model_commit':'96f0ca8b0bddf8ba0eed4f1cfa6847307b0df1ea','model_sha256_before_retrieval':'274753ea36728652d10b10fa7d02b6f77b37304084bb2b0b056128b734e394d4','files':rows}
          (root/'manifest.json').write_text(json.dumps(metadata,indent=2))
          print('Retrieved',len(rows),'test data and codebook files; no model fitting in this workflow.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compact14-validation2015
          path: validation14/
          retention-days: 1
          if-no-files-found: error
