name: Registered cause contracts
on:
  pull_request:
    paths:
      - research/mortality/registered_causes10.py
      - tests/test_registered10.py
      - .github/workflows/registered-causes10-checks.yml
  push:
    branches: [research/registered-causes-10]
    paths:
      - research/mortality/registered_causes10.py
      - tests/test_registered10.py
      - .github/workflows/registered-causes10-checks.yml
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Offline coding contracts only; not the raw-source scientific analysis
        env:
          PYTHONPATH: tests
        run: python -S -m unittest test_registered10.CodingTests test_registered10.AgeAndSelectionTests test_registered10.BoundsTests -v
