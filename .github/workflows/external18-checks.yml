name: External18 synthetic and permission-boundary checks
on:
  push:
    branches: [research/external-validation-18]
  pull_request:
    paths: ['research/mortality/external18/**', 'tests/test_external18.py', '.github/workflows/external18-checks.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '${{ matrix.python }}'}
      - name: Install numerical test dependencies
        run: python -m pip install numpy pandas scipy scikit-learn
      - name: Synthetic tests only; no cohort data or approval documents retrieved
        run: python -m unittest discover -s tests -p test_external18.py -v
