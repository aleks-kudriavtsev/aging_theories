name: Assay13 paired-method checks
on:
  push:
    branches: [research/assay-robustness-13]
    paths: ['research/mortality/method_bridge13.py', 'tests/test_method_bridge*13.py', '.github/workflows/assay13-checks.yml']
  pull_request:
    paths: ['research/mortality/method_bridge13.py', 'tests/test_method_bridge*13.py', '.github/workflows/assay13-checks.yml']
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test paired-method arithmetic and anti-leakage contracts
        shell: bash
        run: |
          set -euo pipefail
          python -S -m unittest discover -s tests -p 'test_method_bridge*13.py' -v
          python -S -m research.mortality.method_bridge13 --demo --out /tmp/assay13-synthetic.json
          python -S - <<'PY'
          import json
          r=json.load(open('/tmp/assay13-synthetic.json'))
          assert r['status']=='synthetic_method_demo'
          assert r['clinical_use_ready'] is False
          assert r['mortality_transport_validated'] is False
          assert r['specimen_rows_exported'] is False
          print('Synthetic-only path checked; no clinical or cohort validation in this job')
          PY
