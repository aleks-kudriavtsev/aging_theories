name: Protein21 official inputs
on:
  push:
    branches: [research/protein-panel-21]
    paths: [.github/workflows/protein21-inputs.yml]
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Retrieve bounded CDC files without executing repository code
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, urllib.request, urllib.parse
          root=pathlib.Path('protein21_inputs'); root.mkdir()
          hosts={'wwwn.cdc.gov','ftp.cdc.gov'}
          components=['DEMO','BPX','BMX','SMQ','MCQ','BPQ','DIQ','BIOPRO','TCHOL','HDL','GHB','ALB_CR','CBC','SSSNFL']
          urls={f'2013_{c}_H.{ext}':f'https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2013/DataFiles/{c}_H.{ext}' for c in components for ext in ['xpt','htm']}
          urls['2013_mortality.dat']='https://ftp.cdc.gov/pub/Health_Statistics/NCHS/datalinkage/linked_mortality/NHANES_2013_2014_MORT_2019_PUBLIC.dat'
          def retrieve(item):
              name,url=item
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Protein21-public-research/1.0'})
                  with urllib.request.urlopen(request,timeout=50) as response:
                      if urllib.parse.urlparse(response.url).hostname not in hosts: raise ValueError('Unexpected host')
                      data=response.read(30_000_001)
                  if len(data)>30_000_000: raise ValueError('File exceeds bound')
                  if name.endswith('.xpt') and not data.startswith(b'HEADER RECORD'): raise ValueError('Not XPORT')
                  if name.endswith('.dat') and b'<html' in data[:1000].lower(): raise ValueError('Not mortality data')
                  (root/name).write_bytes(data)
                  return {'file':name,'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'status':'retrieved'}
              except Exception as e: return {'file':name,'url':url,'status':'failed','error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: rows=list(pool.map(retrieve,urls.items()))
          (root/'manifest.json').write_text(json.dumps({'plan_commit':'5db2aec2cd021107e6b2f22ff53de238facf75ea','files':rows},indent=2))
          print(json.dumps({'retrieved':sum(r['status']=='retrieved' for r in rows),'failed':[r for r in rows if r['status']=='failed']},indent=2))
          if any(r['status']!='retrieved' and r['file'].endswith(('.xpt','.dat')) for r in rows): raise SystemExit('Required data unavailable')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: protein21-official-inputs
          path: protein21_inputs/
          retention-days: 1
          if-no-files-found: error
