name: Mortality workbench release checks
on:
  push:
    branches: ['dev/workbench-07']
  pull_request:
    paths: ['.gitattributes', 'research/**', 'tests/**', 'tools/**', 'pyproject.toml', 'WORKBENCH_START_RU.md', '.github/workflows/mortality-workbench.yml']
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  offline-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Offline application and evidence contract tests
        run: |
          python -S -m research.mortality.workbench doctor
          python -S -m unittest discover -s tests -p "test_workbench*.py" -v
          python -S -m unittest discover -s tests -p "test_evidence_contract.py" -v
      - name: Build a wheel with pinned build tools
        run: |
          python -m pip install setuptools==82.0.1 wheel==0.46.3
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Verify installed console and packaged data outside checkout
        run: python tools/check_installed_workbench.py dist/mortality_workbench-0.7.0-py3-none-any.whl
