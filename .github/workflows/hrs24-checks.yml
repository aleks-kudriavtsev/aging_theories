name: HRS24 synthetic access and overlap checks
on:
  push:
    branches: [research/hrs-access-24]
    paths: ['research/mortality/hrs24/**', 'tests/test_hrs24.py', '.github/workflows/hrs24-checks.yml']
  pull_request:
    paths: ['research/mortality/hrs24/**', 'tests/test_hrs24.py', '.github/workflows/hrs24-checks.yml']
permissions:
  contents: read
jobs:
  synthetic_only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Synthetic fixtures only; no HRS downloads, credentials or records
        run: python -S -m unittest discover -s tests -p test_hrs24.py -v
