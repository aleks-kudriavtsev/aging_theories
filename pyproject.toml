[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mortality-workbench"
version = "0.7.0"
description = "Local research-only historical mortality benchmark"
requires-python = ">=3.10"
readme = "WORKBENCH_START_RU.md"
license = "MIT"
dependencies = []

[project.scripts]
mortality-workbench = "research.mortality.workbench.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["research", "research.mortality", "research.mortality.workbench"]
namespaces = false

[tool.setuptools.package-data]
"research.mortality.workbench" = ["static/*.html", "static/*.js", "static/*.css"]
"research.mortality" = ["evidence.json", "evidence_02.json", "reanalysis06/model_bundle.json", "nhanes04/metrics.csv", "nhanes04/clinical_sensitivity.csv", "nhanes04/clinical_sensitivity_intervals.csv", "nhanes04/validation_intervals.csv"]
